apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-resource-quota
spec:
  hard:
    limits.cpu: {{ .Values.resources.cpuLimit | quote }}
    limits.memory: {{ .Values.resources.memoryLimit | quote }}
    pods: "15"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-test-namespace
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stale-env-cleaner
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleaner
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Checking stale namespaces older than {{ .Values.cleanup.ttlHours }}h..."
                  kubectl get ns -l managed-by=qa-ci
