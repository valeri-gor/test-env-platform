name: Dynamic QA Environment Lifecycle (Kubernetes + Helm + Allure)

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

env:
  ENV_NS: test-pr-${{ github.event.pull_request.number || 'main' }}

jobs:
  manage-test-environment:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Получение исходного кода
        uses: actions/checkout@v4

      - name: 2. Создание 3-узлового кластера Kubernetes (kind)
        run: |
          cat <<EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          - role: worker
          EOF
          kind create cluster --name qa-cluster --config kind-config.yaml --wait 2m
          kubectl get nodes

      - name: 3. Сборка и предзагрузка образов в кластер Kubernetes
        if: github.event.action != 'closed'
        run: |
          docker build -t test-env-backend:ci ./app/backend
          docker build -t test-env-frontend:ci ./app/frontend
          docker build -t test-env-tests:ci ./tests
          kind load docker-image test-env-backend:ci --name qa-cluster
          kind load docker-image test-env-frontend:ci --name qa-cluster
          kind load docker-image test-env-tests:ci --name qa-cluster

      - name: 4. Развёртывание изолированной тестовой среды через Helm
        if: github.event.action != 'closed'
        run: |
          kubectl create namespace $ENV_NS --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace $ENV_NS managed-by=qa-ci --overwrite
          helm upgrade --install qa-release ./helm/test-env \
            --namespace $ENV_NS \
            --set envName=$ENV_NS \
            --set imageTag=ci \
            --wait --timeout 8m
          kubectl get pods,svc,resourcequota,networkpolicy -n $ENV_NS

      - name: 5. Настройка заглушки WireMock и запуск автотестов (pytest + Selenium)
        if: github.event.action != 'closed'
        run: |
          kubectl port-forward svc/wiremock 8081:8080 -n $ENV_NS &
          sleep 3
          curl -X POST http://localhost:8081/__admin/mappings -d @wiremock/mappings/payment.json
          kubectl run qa-test-job --rm -i --restart=Never \
            --image=test-env-tests:ci \
            --image-pull-policy=IfNotPresent \
            --namespace=$ENV_NS -- pytest -v

      - name: 6. Сохранение результатов Allure в артефакты сборки
        if: always() && github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-report
          path: allure-results/

      - name: 7. Удаление тестовой среды после проверки или закрытия PR
        if: always()
        run: |
          helm uninstall qa-release -n $ENV_NS || true
          kubectl delete namespace $ENV_NS --ignore-not-found=true || true
